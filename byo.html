<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Poké Box - Build Your Own</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Mobile Screen Container -->
  <div class="mobile-container">

    <!-- Slide-in Side Drawer (Hamburger Menu) -->
    <div id="drawer-backdrop" class="drawer-backdrop"></div>
    <aside id="side-drawer" class="side-drawer" aria-label="Navigation Menu">
      <div class="drawer-header">
        <img src="images/logo.svg" alt="The Poké Box Logo" class="drawer-logo-img">
        <button id="close-drawer-btn" class="close-btn" aria-label="Close menu">&times;</button>
      </div>
      <nav class="drawer-nav">
        <a href="#signin" class="drawer-link">Sign in</a>
        <a href="#create-account" class="drawer-link">Create account</a>
        <a href="#gift-cards" class="drawer-link">Gift cards</a>
      </nav>
    </aside>

    <!-- Top Header -->
    <header class="site-header">
      <button id="hamburger-btn" class="icon-btn hamburger-btn" aria-label="Open menu">
        &#9776;
      </button>

      <div class="logo-container">
        <a href="index.html">
          <img src="images/logo.svg" alt="The Poké Box Logo" class="header-logo-img">
        </a>
      </div>

      <button class="icon-btn cart-btn" aria-label="Cart" onclick="window.location.href='cart.html'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
      </button>
    </header>

    <!-- Sticky BYO Header / Banner -->
    <div class="byo-sticky-header">
      <div class="byo-header-top">
        <a href="index.html" class="close-x-btn" aria-label="Return to menu">&times;</a>
        <div class="byo-header-titles">
          <h1 class="byo-title">Build Your Own</h1>
          <span class="byo-subtitle">Starts at $8.99</span>
          <div class="qty-counter">
            <button type="button" class="qty-btn minus-btn" aria-label="Decrease quantity">-</button>
            <span class="qty-num">1</span>
            <button type="button" class="qty-btn plus-btn" aria-label="Increase quantity">+</button>
          </div>
        </div>
      </div>
      <p class="byo-desc">Your choice of size, base, proteins, veggies, toppings, sauces, and garnishes.</p>

      <!-- Stage Navigation Scrollbar -->
      <nav class="stages-scrollbar" aria-label="Stages">
        <button type="button" class="stage-tab active" data-step-target="step-1">1. Size</button>
        <button type="button" class="stage-tab" data-step-target="step-2">2. Base</button>
        <button type="button" class="stage-tab" data-step-target="step-3">3. Protein</button>
        <button type="button" class="stage-tab" data-step-target="step-4">4. Veggies</button>
        <button type="button" class="stage-tab" data-step-target="step-5">5. Toppings</button>
        <button type="button" class="stage-tab" data-step-target="step-6">6. Sauce</button>
        <button type="button" class="stage-tab" data-step-target="step-7">7. Garnish</button>
      </nav>
    </div>

    <!-- Main Scrollable Steps Content -->
    <main class="main-content byo-content">

      <!-- Step 1: Select a size -->
      <div class="accordion-step open" id="step-1">
        <button class="accordion-header" type="button">
          <span class="step-title">Select a Size</span>
          <span class="chevron-icon">&#9650;</span>
        </button>
        <div class="accordion-body">
          <div class="input-group">
            <select class="custom-select" id="size-select">
              <option value="" disabled selected>Select one</option>
              <option value="small" data-price="$8.99"
                data-desc="Your choice of size, base, proteins, two veggies, one topping, sauces, and garnishes.">Small
                bowl - $8.99</option>
              <option value="regular" data-price="$10.99"
                data-desc="Your choice of size, base, proteins, three veggies, two toppings, sauces, and garnishes.">
                Regular bowl - $10.99</option>
              <option value="large" data-price="$13.29"
                data-desc="Your choice of size, base, proteins, four veggies, three toppings, sauces, and garnishes.">
                Large bowl - $13.29</option>
            </select>
          </div>
          <div class="step-nav-buttons">
            <button type="button" class="done-btn next-btn">Next</button>
          </div>
        </div>
      </div>

      <!-- Step 2: Pick Base (max 2) -->
      <div class="accordion-step" id="step-2">
        <button class="accordion-header" type="button">
          <span class="step-title">Pick Base (max 2)</span>
          <span class="chevron-icon">&#9660;</span>
        </button>

          <div class="checkbox-group max-limit-group" data-max="2">
            <label class="checkbox-label">
              <input type="checkbox" name="base" value="sushi-rice">
              <span>Sushi Rice</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="base" value="grain-blend">
              <span>Grain Blend</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="base" value="zucchini-noodles">
              <span>Zucchini Noodles</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="base" value="mixed-greens">
              <span>Mixed Greens</span>
            </label>
          </div>
          <div class="step-nav-buttons">
            <button type="button" class="prev-btn">Prev</button>
            <button type="button" class="done-btn next-btn">Next</button>
          </div>
        </div>
      </div>

      <!-- Step 3: Choose Protein -->
