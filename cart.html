<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Poké Box - Cart</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Mobile Screen Container -->
  <div class="mobile-container">

    <!-- Top Header -->
    <header class="site-header cart-header">
      <a href="index.html" class="back-btn" aria-label="Back">
        &lt; Back
      </a>

      <div class="logo-container">
        <a href="index.html">
          <img src="images/logo.svg" alt="The Poké Box Logo" class="header-logo-img">
        </a>
      </div>

      <div class="cart-count">
        1 item
      </div>
    </header>

    <!-- Main Scrollable Content -->
    <main class="main-content cart-content">
      <h1 class="page-title">Cart</h1>

      <!-- Empty Cart State -->
      <div id="empty-cart-state" style="display: none; text-align: center; margin-top: 60px;">
        <h2 style="margin-bottom: 24px; font-weight: 700; color: var(--color-black);">Your cart is empty</h2>
        <a href="index.html" class="add-more-btn" style="width: auto; padding: 12px 32px; display: inline-block;">Add items</a>
      </div>

      <!-- Full Cart State -->
      <div id="full-cart-state" style="display: none;">
        <!-- Cart Item -->
        <div class="cart-item-card" id="cart-item-1">
        <div class="cart-item-top" style="cursor: pointer;" onclick="window.location.href='byo.html'" title="Edit this bowl">
          <div class="cart-item-img" style="border-radius: 8px; overflow: hidden; border: 2px solid var(--color-black);">
            <img src="images/byo.jpg" alt="Custom Bowl" style="width: 100%; height: 100%; object-fit: cover;">
          </div>
          <div class="cart-item-details">
            <h3 class="cart-item-title">Custom Bowl</h3>
            <p class="cart-item-desc">Regular bowl, Sushi Rice, Salmon, Edamame, Seaweed Salad</p>
          </div>
          <div class="cart-item-price" data-base-price="12.69">$12.69</div>
        </div>
        <div class="cart-item-bottom">
          <div class="qty-counter cart-qty">
            <button type="button" class="qty-btn cart-minus-btn" aria-label="Decrease quantity">-</button>
            <span class="qty-num cart-qty-num">1</span>
            <button type="button" class="qty-btn cart-plus-btn" aria-label="Increase quantity">+</button>
          </div>
          <button class="trash-btn" aria-label="Remove item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
          </button>
        </div>
      </div>

      <a href="index.html" class="add-more-btn">Add more items</a>

      <!-- Tip Section -->
      <section class="tip-section">
        <h2 class="section-title" style="border-bottom: none;">Add a tip</h2>
        <div class="tip-options">
          <button class="tip-btn" data-tip="10">10%</button>
          <button class="tip-btn" data-tip="12">12%</button>
          <button class="tip-btn selected" data-tip="15">15%</button>
          <button class="tip-btn" data-tip="other">Other</button>
        </div>
      </section>

      <!-- Summary Section -->
      <section class="cart-summary">
        <div class="summary-line">
          <span>Subtotal</span>
          <span id="cart-subtotal">$12.69</span>
        </div>
        <div class="summary-line">
          <span>HST (13%)</span>
          <span id="cart-hst">$1.65</span>
        </div>
        <div class="summary-line">
          <span>Tip</span>
          <span id="cart-tip">$1.90</span>
        </div>
        <div class="summary-line total-line">
          <span>Total</span>
          <span id="cart-total">$16.24</span>
        </div>
      </section>
      </div> <!-- End full-cart-state -->
    </main>

    <!-- Bottom Bar -->
    <footer id="cart-bottom-bar" class="byo-bottom-bar" style="padding: 16px; display: none;">
      <button type="button" class="add-to-cart-btn">Continue to Payment</button>
    </footer>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
